<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pianissimo spike</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 24px; background: #0f172a; color: #e2e8f0; }
      fieldset { border: 1px solid #334155; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #94a3b8; }
      select, input, button { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: inherit; }
      button { cursor: pointer; background: #0284c7; border-color: #0284c7; }
      button:disabled { opacity: .5; }
      table { border-collapse: collapse; margin-top: 16px; width: 100%; }
      th, td { border-bottom: 1px solid #334155; padding: 6px 8px; text-align: left; vertical-align: top; }
      small { color: #94a3b8; }
      tr.err td { color: #fca5a5; }
      pre { background: #020617; padding: 12px; height: 260px; overflow: auto; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>Pianissimo vs KB-Whisper — FLEURS sv_se</h1>
    <p>Status: <b id="status">idle</b></p>
    <fieldset>
      <label>Engine
        <select id="engine">
          <option value="pianissimo">Pianissimo (parakeet.js)</option>
          <option value="whisper">Whisper (transformers.js)</option>
        </select>
      </label>
      <label>Backend
        <select id="backend"><option>wasm</option><option>webgpu</option></select>
      </label>
      <label>Quant (Pianissimo encoder: int8/fp16/fp32 · Whisper: q8/q4f16/fp32)
        <input id="quant" value="int8" size="6" />
      </label>
      <label>Pianissimo decoder (int8/fp16/fp32)
        <input id="dec" value="int8" size="6" />
      </label>
      <label>WASM threads (0 = default)
        <input id="threads" type="number" value="0" min="0" max="16" />
      </label>
      <label>Whisper model
        <select id="whisperModel">
          <option>KBLab/kb-whisper-base</option>
          <option>KBLab/kb-whisper-small</option>
          <option>KBLab/kb-whisper-medium</option>
          <option>KBLab/kb-whisper-large</option>
        </select>
      </label>
      <label>Clips (0 = all)
        <input id="n" type="number" value="20" min="0" />
      </label>
      <label>Long file <input id="long" type="checkbox" /></label>
      <button id="run">Run</button>
      <button id="copy" type="button">Copy JSON</button>
      <button id="clear" type="button">Clear</button>
    </fieldset>
    <table>
      <thead>
        <tr><th>Config</th><th>Load</th><th>Clips</th><th>Clip speed</th><th>Clip WER</th>
          <th>Long speed</th><th>Long WER</th><th>Memory MB</th><th>Error</th></tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
